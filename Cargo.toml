[package]
name = "dsh-ocean"
version = "0.1.1"
edition = "2021"
rust-version = "1.90"
description = "DSH Ocean — native desktop client for DeepSeek Harness"
license = "MIT"
repository = "https://github.com/ryltsevmikhail/dsh-ocean"
build = "build.rs"
# crates.io publication discards root patches; review a registry-safe strategy first.
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "zeroize"] }
gtk = "0.18"
libc = "0.2"
sha2 = "0.11"
regex = "1"
qrcodegen = "1.8"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.3", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
url = "2"
javascriptcore = { package = "javascriptcore-rs", version = "1.1.2" }
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }

# GTK3/Tauri require the 0.18 ABI/type family. This exact upstream backport
# fixes RUSTSEC-2024-0429 without inventing an unaffected upstream version.
[patch.crates-io]
glib = { path = "vendor/glib" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
