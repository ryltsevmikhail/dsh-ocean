name: clean-bootstrap

# Explicit opt-in: this downloads the real Node/DSH runtime (~750 MB installed).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 20
    steps:
      - name: Install OS prerequisites (no Node/npm)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl jq tar gzip util-linux \
            python3 make g++

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Real bootstrap and repeat install without system Node
        run: bash scripts/test-bootstrap-clean.sh
