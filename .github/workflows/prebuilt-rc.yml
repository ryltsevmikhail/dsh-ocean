name: checked prebuilt RC2

# Explicitly selected Linux x86_64 RC2 only. Never bootstrap unpublished npm
# packages, rebuild the accepted archives, alter trust or activate a server.
on:
  workflow_dispatch:
    inputs:
      product:
        type: choice
        options: [shell, runtime]
        required: true
      publish:
        description: Publish the verified signed draft as a next prerelease
        type: boolean
        default: false
        required: true
      dry_run:
        description: Validate staged bytes only; do not sign or upload
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.product }}-next
  cancel-in-progress: false

jobs:
  checked-prebuilt:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release-${{ inputs.product }}
    permissions:
      contents: write
    env:
      PRODUCT: ${{ inputs.product }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate publisher guard tests
        run: python3 -B tests/test_prebuilt_release.py
      - name: Download exact reviewed inputs from the unpublished draft
        run: |
          set -euo pipefail
          jq -e --arg p "$PRODUCT" '.[$p]' docs/releases/rc2-prebuilt-lock.json > "$RUNNER_TEMP/lock.json"
          tag="$(jq -er .tag "$RUNNER_TEMP/lock.json")"
          file="$(jq -er .filename "$RUNNER_TEMP/lock.json")"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -e --arg tag "$tag" '[.[][] | select(.tag_name == $tag)] | if length == 1 then .[0] else error("missing/duplicate release") end' > "$RUNNER_TEMP/draft.json"
          jq -e --arg tag "$tag" '.draft == true and .tag_name == $tag' "$RUNNER_TEMP/draft.json"
          commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
          mkdir -m 700 "$RUNNER_TEMP/prebuilt"
          files=("$file")
          if [ "$PRODUCT" = shell ]; then
            files+=(native-evidence.json)
          fi
          for name in "${files[@]}"; do
            asset_id="$(jq -er --arg n "$name" '[.assets[] | select(.name == $n)] | if length == 1 then .[0].id else error("missing/duplicate asset") end' "$RUNNER_TEMP/draft.json")"
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$RUNNER_TEMP/prebuilt/$name"
          done
          python3 -B scripts/check-prebuilt-release.py --lock "$RUNNER_TEMP/lock.json" --directory "$RUNNER_TEMP/prebuilt" --tag-commit "$commit"
          release="$(jq -er .release "$RUNNER_TEMP/lock.json")"
          sequence="$(jq -er .sequence "$RUNNER_TEMP/lock.json")"
          python3 -B scripts/release-artifacts.py plan --product "$PRODUCT" --channel next --release "$release" --sequence "$sequence" --publication-target linux-x86_64 --source-commit "$commit" --tag-commit "$commit" > "$RUNNER_TEMP/plan.json"
          python3 -B scripts/release-artifacts.py artifact --product "$PRODUCT" --channel next --release "$release" --sequence "$sequence" --target linux-x86_64 --file "$RUNNER_TEMP/prebuilt/$file" > "$RUNNER_TEMP/prebuilt/artifact.json"
          python3 -B scripts/release-artifacts.py manifest --product "$PRODUCT" --channel next --release "$release" --sequence "$sequence" --publication-target linux-x86_64 --artifact "$RUNNER_TEMP/prebuilt/artifact.json" > "$RUNNER_TEMP/manifest.json"
      - name: Require recorded native and notice review before signing
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_CLEARANCE: ${{ vars.OCEAN_RELEASE_CLEARANCE }}
        run: test "$RELEASE_CLEARANCE" = owner-reviewed-native-and-license-clearance
      - name: Install independent verifier dependencies
        if: ${{ !inputs.dry_run }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: ${{ !inputs.dry_run }}
        with:
          toolchain: 1.90.0
      - name: Compile independent verifier from the accepted product source
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          commit="$(jq -er .sourceCommit "$RUNNER_TEMP/lock.json")"
          git cat-file -e "$commit^{commit}" || git fetch --no-tags origin "$commit"
          git worktree add --detach "$RUNNER_TEMP/verifier-source" "$commit"
          cd "$RUNNER_TEMP/verifier-source"
          cargo build --locked --bin dsh-ocean
      - name: Sign shell with the existing protected shell key
        if: ${{ !inputs.dry_run && inputs.product == 'shell' }}
        env:
          OCEAN_RELEASE_DRAFT_APPROVED: "yes"
          OCEAN_RELEASE_SIGNING_KEY_PEM: ${{ secrets.OCEAN_SHELL_SIGNING_KEY_PEM }}
          OCEAN_RELEASE_KEY_ID: ${{ vars.OCEAN_SHELL_KEY_ID }}
          OCEAN_RELEASE_PUBLIC_KEY_SHA256: ${{ vars.OCEAN_SHELL_PUBLIC_KEY_SHA256 }}
        run: node scripts/sign-publisher-release.mjs --manifest "$RUNNER_TEMP/manifest.json" --product shell --mode publisher --output-dir "$RUNNER_TEMP/signature"
      - name: Sign runtime with the existing protected runtime key
        if: ${{ !inputs.dry_run && inputs.product == 'runtime' }}
        env:
          OCEAN_RELEASE_DRAFT_APPROVED: "yes"
          OCEAN_RELEASE_SIGNING_KEY_PEM: ${{ secrets.OCEAN_RUNTIME_SIGNING_KEY_PEM }}
          OCEAN_RELEASE_KEY_ID: ${{ vars.OCEAN_RUNTIME_KEY_ID }}
          OCEAN_RELEASE_PUBLIC_KEY_SHA256: ${{ vars.OCEAN_RUNTIME_PUBLIC_KEY_SHA256 }}
        run: node scripts/sign-publisher-release.mjs --manifest "$RUNNER_TEMP/manifest.json" --product runtime --mode publisher --output-dir "$RUNNER_TEMP/signature"
      - name: Independently verify signature, policy and full accepted archive
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          file="$(jq -er .filename "$RUNNER_TEMP/lock.json")"
          sequence="$(jq -er .sequence "$RUNNER_TEMP/lock.json")"
          export HOME="$RUNNER_TEMP/verify-home" DSH_HOME="$RUNNER_TEMP/verify-home/dsh" XDG_CONFIG_HOME="$RUNNER_TEMP/verify-home/config" XDG_STATE_HOME="$RUNNER_TEMP/verify-home/state" XDG_CACHE_HOME="$RUNNER_TEMP/verify-home/cache"
          mkdir -m 700 "$HOME"
          verifier="$RUNNER_TEMP/verifier-source/target/debug/dsh-ocean"
          args=("$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/signature/signature.json" "$RUNNER_TEMP/signature/public-key.json" --channel next --target linux-x86_64 --min-sequence "$sequence" --artifact "$RUNNER_TEMP/prebuilt/$file")
          if [ "$PRODUCT" = runtime ]; then
            "$verifier" --import-runtime-release "${args[@]}" --current-runtime-version 0.0.0-0 --prefix "$RUNNER_TEMP/verified-runtime" --confirm-import yes
          else
            "$verifier" --verify-release "${args[@]}" --kind tar.gz
          fi
      - name: Upload signatures and optionally publish next prerelease
        if: ${{ !inputs.dry_run }}
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          tag="$(jq -er .tag "$RUNNER_TEMP/lock.json")"
          commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
          python3 -B scripts/check-prebuilt-release.py --lock "$RUNNER_TEMP/lock.json" --directory "$RUNNER_TEMP/prebuilt" --tag-commit "$commit"
          release_id="$(jq -er .id "$RUNNER_TEMP/draft.json")"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -e --arg tag "$tag" '[.[][] | select(.tag_name == $tag)] | if length == 1 then .[0] else error("missing/duplicate release") end' > "$RUNNER_TEMP/before-upload.json"
          jq -e --argjson id "$release_id" '.id == $id and .draft == true' "$RUNNER_TEMP/before-upload.json"
          # No --clobber: an existing signature/manifest must be investigated.
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/signature/signature.json" "$RUNNER_TEMP/signature/public-key.json"
          # Verify remote identities AND bytes after compilation/signing/upload.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -e --arg tag "$tag" '[.[][] | select(.tag_name == $tag)] | if length == 1 then .[0] else error("missing/duplicate release") end' > "$RUNNER_TEMP/final-draft.json"
          jq -e --argjson id "$release_id" '.id == $id and .draft == true' "$RUNNER_TEMP/final-draft.json"
          mkdir -m 700 "$RUNNER_TEMP/remote-final"
          file="$(jq -er .filename "$RUNNER_TEMP/lock.json")"
          files=("$file" manifest.json signature.json public-key.json)
          if [ "$PRODUCT" = shell ]; then files+=(native-evidence.json); fi
          for name in "${files[@]}"; do
            asset_id="$(jq -er --arg n "$name" '[.assets[] | select(.name == $n)] | if length == 1 then .[0].id else error("missing/duplicate asset") end' "$RUNNER_TEMP/final-draft.json")"
            if [ "$name" = "$file" ] || [ "$name" = native-evidence.json ]; then
              original_id="$(jq -er --arg n "$name" '.assets[] | select(.name == $n) | .id' "$RUNNER_TEMP/draft.json")"
              test "$asset_id" = "$original_id"
              local_file="$RUNNER_TEMP/prebuilt/$name"
            elif [ "$name" = manifest.json ]; then
              local_file="$RUNNER_TEMP/manifest.json"
            else
              local_file="$RUNNER_TEMP/signature/$name"
            fi
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$RUNNER_TEMP/remote-final/$name"
            cmp -- "$local_file" "$RUNNER_TEMP/remote-final/$name"
          done
          commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
          python3 -B scripts/check-prebuilt-release.py --lock "$RUNNER_TEMP/lock.json" --directory "$RUNNER_TEMP/remote-final" --tag-commit "$commit"
          if [ "$PUBLISH" = true ]; then
            # Address captured release ID, never accidentally publish a recreated draft.
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false -F prerelease=true -f make_latest=false
          fi
