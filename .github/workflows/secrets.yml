name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned scanner in runner temp
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXXXX")"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$tool_dir/scanner.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tool_dir/scanner.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/scanner.tar.gz" -C "$tool_dir" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Scan reachable checkout history with fully redacted output
        shell: bash
        run: |
          set -euo pipefail
          # HEAD includes both parents of the PR merge checkout. Never scan local
          # unrelated remotes/checkpoints with --all or upload raw findings.
          # Use the base branch's reviewed exclusions on PRs, not a contributor's
          # proposed allowlist, and disable inline gitleaks:allow bypasses.
          policy_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks-policy.XXXXXXXX")"
          : > "$policy_dir/.gitleaksignore"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="$(jq -r .pull_request.base.sha "$GITHUB_EVENT_PATH")"
            if git cat-file -e "$base_sha:.gitleaksignore" 2>/dev/null; then
              git show "$base_sha:.gitleaksignore" > "$policy_dir/.gitleaksignore"
            fi
          fi
          args=(--gitleaks-ignore-path "$policy_dir/.gitleaksignore")
          # Ignore repository-supplied rule configuration: use scanner defaults.
          config="$(mktemp "$RUNNER_TEMP/gitleaks-defaults.XXXXXXXX.toml")"
          printf '[extend]\nuseDefault = true\n' > "$config"
          gitleaks git --config "$config" --ignore-gitleaks-allow --redact=100 \
            --no-banner --log-opts=HEAD "${args[@]}" .
