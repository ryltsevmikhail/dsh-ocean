name: Bug report
description: Report a reproducible Ocean desktop problem (not a security vulnerability).
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow SECURITY.md instead. Never post tokens, authenticated URLs, profile archives, private prompts or unredacted diagnostics.
  - type: checkboxes
    attributes:
      label: Before reporting
      options:
        - label: I searched existing issues and read the support instructions.
          required: true
        - label: I removed credentials and private data from this report.
          required: true
  - type: input
    attributes:
      label: Ocean version or commit
      placeholder: "Output of dsh-ocean --version; commit if built from source"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Distribution, architecture, desktop, X11/Wayland, GTK/WebKit versions, installation method, and service or managed child.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Minimal steps using synthetic data. Does the problem also occur in a normal browser without Ocean?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Redacted diagnostic details (optional)
      description: Inspect manually; built-in launch-token redaction does not remove all sensitive information.
      render: text
